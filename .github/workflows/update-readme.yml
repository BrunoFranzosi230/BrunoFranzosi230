name: Atualizar README

on:
  schedule:
    - cron: "0 12,0 * * *"   # 09:00 e 21:00 BRT
  workflow_dispatch:
  push:
    paths:
      - profile.config.json
      - scripts/**

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gerar SVGs
        run: node scripts/generate.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "chore: sync diagnostics [skip ci]"
          git push
