name: Atualizar README

on:
  schedule:
    - cron: "0 12,0 * * *"   # 09:00 e 21:00 BRT
  workflow_dispatch:
  push:
    paths:
      - profile.config.json
      - README.template.md
      - scripts/**

permissions:
  contents: write

# Evita duas execuções ao mesmo tempo disputando o push na main.
concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Sempre pega a main atual (re-runs reutilizam o SHA antigo por padrão).
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gerar SVGs, commit e push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            node scripts/generate.mjs
            git add -A assets README.md
            if git diff --cached --quiet; then
              echo "Nada para atualizar."
              exit 0
            fi
            git commit -m "chore: sync diagnostics [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejeitado (main mudou). Sincronizando e gerando de novo... ($attempt/3)"
            git fetch origin main
            git reset --hard origin/main
            sleep $((attempt * 5))
          done

          echo "::error::Não foi possível fazer push após 3 tentativas."
          exit 1
