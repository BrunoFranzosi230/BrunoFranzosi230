<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="50" viewBox="0 0 1000 50">
<defs>
  <pattern id="hstripe" width="6" height="4" patternUnits="userSpaceOnUse">
    <rect width="6" height="2" fill="#00f0ff" opacity=".85"/>
  </pattern>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20 0H0V20" fill="none" stroke="#00f0ff" stroke-opacity=".05"/>
  </pattern>
  <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#000" opacity=".35"/>
  </pattern>
  <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softglow" x="-10%" y="-40%" width="120%" height="180%">
    <feGaussianBlur stdDeviation="1.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter></defs>
<style>
  text{font-family:'JetBrains Mono','Share Tech Mono','Consolas','Courier New',monospace}
  .d{font-family:'Orbitron','Rajdhani','Bahnschrift','Arial Narrow','Consolas',monospace;font-weight:800}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.35}95%{opacity:1}97%{opacity:.6}}
  @keyframes sweep{0%{transform:translateY(-40px)}100%{transform:translateY(400px)}}
  @keyframes glitch{0%,88%,100%{transform:translate(0,0);opacity:0}89%{transform:translate(-4px,1px);opacity:.7}91%{transform:translate(3px,-1px);opacity:.6}93%{opacity:0}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  .blink{animation:blink 1.1s steps(1) infinite}
  .flick{animation:flick 4s infinite}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>

  <line x1="0" y1="10" x2="1000" y2="10" stroke="#0e5e6e"/>
  <rect x="0" y="8" width="120" height="4" fill="#00f0ff"/>
  <rect x="880" y="8" width="120" height="4" fill="#00f0ff"/>
  <text x="500" y="36" text-anchor="middle" font-size="11" letter-spacing="3" fill="#00b8d4">// END OF TRANSMISSION — CONNECTION KEPT ALIVE <tspan class="blink" fill="#00f0ff">█</tspan></text>
  
</svg>