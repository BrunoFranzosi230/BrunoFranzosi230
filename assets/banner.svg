<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340">
<defs>
  <pattern id="hstripe" width="6" height="4" patternUnits="userSpaceOnUse">
    <rect width="6" height="2" fill="#00ff88" opacity=".85"/>
  </pattern>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20 0H0V20" fill="none" stroke="#00ff88" stroke-opacity=".05"/>
  </pattern>
  <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#000" opacity=".35"/>
  </pattern>
  <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softglow" x="-10%" y="-40%" width="120%" height="180%">
    <feGaussianBlur stdDeviation="1.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter></defs>
<style>
  text{font-family:'JetBrains Mono','Share Tech Mono','Consolas','Courier New',monospace}
  .d{font-family:'Orbitron','Rajdhani','Bahnschrift','Arial Narrow','Consolas',monospace;font-weight:800}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.35}95%{opacity:1}97%{opacity:.6}}
  @keyframes sweep{0%{transform:translateY(-40px)}100%{transform:translateY(400px)}}
  @keyframes glitch{0%,88%,100%{transform:translate(0,0);opacity:0}89%{transform:translate(-4px,1px);opacity:.7}91%{transform:translate(3px,-1px);opacity:.6}93%{opacity:0}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  .blink{animation:blink 1.1s steps(1) infinite}
  .flick{animation:flick 4s infinite}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>

  <rect width="1000" height="340" fill="#020805"/>
  <rect width="1000" height="340" fill="url(#grid)"/>

  <!-- faixa lateral -->
  <rect x="0" y="0" width="70" height="340" fill="url(#hstripe)" opacity=".55"/>
  <rect x="18" y="0" width="34" height="340" fill="#020805"/>
  <text x="35" y="56.5" text-anchor="middle" font-size="20" fill="#00ff88" class="flick" style="font-family:'Noto Sans JP','Yu Gothic','Meiryo',sans-serif">ブ</text><text x="35" y="83.5" text-anchor="middle" font-size="20" fill="#00ff88" class="flick" style="font-family:'Noto Sans JP','Yu Gothic','Meiryo',sans-serif">ル</text><text x="35" y="110.5" text-anchor="middle" font-size="20" fill="#00ff88" class="flick" style="font-family:'Noto Sans JP','Yu Gothic','Meiryo',sans-serif">ー</text><text x="35" y="137.5" text-anchor="middle" font-size="20" fill="#00ff88" class="flick" style="font-family:'Noto Sans JP','Yu Gothic','Meiryo',sans-serif">ノ</text><text x="35" y="164.5" text-anchor="middle" font-size="20" fill="#00ff88" class="flick" style="font-family:'Noto Sans JP','Yu Gothic','Meiryo',sans-serif">・</text><text x="35" y="191.5" text-anchor="middle" font-size="20" fill="#00ff88" class="flick" style="font-family:'Noto Sans JP','Yu Gothic','Meiryo',sans-serif">フ</text><text x="35" y="218.5" text-anchor="middle" font-size="20" fill="#00ff88" class="flick" style="font-family:'Noto Sans JP','Yu Gothic','Meiryo',sans-serif">ラ</text><text x="35" y="245.5" text-anchor="middle" font-size="20" fill="#00ff88" class="flick" style="font-family:'Noto Sans JP','Yu Gothic','Meiryo',sans-serif">ン</text><text x="35" y="272.5" text-anchor="middle" font-size="20" fill="#00ff88" class="flick" style="font-family:'Noto Sans JP','Yu Gothic','Meiryo',sans-serif">ゾ</text><text x="35" y="299.5" text-anchor="middle" font-size="20" fill="#00ff88" class="flick" style="font-family:'Noto Sans JP','Yu Gothic','Meiryo',sans-serif">シ</text>
  <rect x="74" y="0" width="6" height="340" fill="#00ff88" opacity=".9"/>

  <!-- cunha diagonal -->
  <polygon points="80,0 1000,0 1000,10 80,98" fill="url(#hstripe)" opacity=".75"/>
  <line x1="80" y1="98" x2="1000" y2="10" stroke="#00ff88" stroke-width="2"/>
  <line x1="80" y1="106" x2="1000" y2="18" stroke="#00ff88" stroke-width=".6" opacity=".5"/>

  <!-- título -->
  <g transform="translate(104 212)">
    <text class="d" font-size="86" letter-spacing="6" fill="#00ff88" filter="url(#glow)">BRUNO</text>
    <text class="d" font-size="86" letter-spacing="6" fill="url(#scan)">BRUNO</text>
    <text class="d" font-size="86" letter-spacing="6" fill="#d6ffea" style="animation:glitch 3.7s infinite">BRUNO</text>
  </g>
  <text x="106" y="242" font-size="15" font-weight="700" letter-spacing="4" fill="#00ff88">NETRUNNER OPERATIONS</text>
  <text x="106" y="262" font-size="11" fill="#00c46a" letter-spacing="1">//////////</text>
  <line x1="200" y1="258" x2="560" y2="258" stroke="#00c46a" stroke-width="1"/>
  <text x="106" y="279" font-size="10" letter-spacing="1" fill="#6fcf9c">CURR_NETWORK: <tspan fill="#00ff88">GITHUB.COM/BRUNOFRANZOSI230</tspan></text>
  <text x="106" y="293" font-size="10" letter-spacing="1" fill="#6fcf9c">NL_PORT_STATUS: <tspan fill="#d6ffea" font-weight="700">OPEN</tspan></text>
  <text x="104" y="322" class="d" font-size="27" letter-spacing="5" fill="#00ff88" filter="url(#softglow)">127.0.0.1<tspan class="blink" fill="#d6ffea">_</tspan></text>

  <!-- painel login -->
  <polygon points="630,118 984,118 984,308 612,308 612,136" fill="#03100a" stroke="#00ff88" stroke-width="1.2"/>
  <polygon points="632,123 979,123 979,303 617,303 617,138" fill="none" stroke="#0d4a2c" stroke-width="1"/>
  <text x="798" y="144" text-anchor="middle" font-size="11" letter-spacing="3" fill="#00ff88">SECURITY LOGIN</text>
  <line x1="628" y1="156" x2="968" y2="156" stroke="#0f6b3e" stroke-dasharray="3 3"/>
  <text x="630" y="178" font-size="10.5" fill="#6fcf9c" letter-spacing=".8">UID   <tspan fill="#00c46a">:: </tspan><tspan fill="#00ff88">BRUNOFRANZOSI230</tspan></text><text x="630" y="197" font-size="10.5" fill="#6fcf9c" letter-spacing=".8">IDENT <tspan fill="#00c46a">:: </tspan><tspan fill="#00ff88">BRUNO FRANZOSI</tspan></text><text x="630" y="216" font-size="10.5" fill="#6fcf9c" letter-spacing=".8">CLASS <tspan fill="#00c46a">:: </tspan><tspan fill="#00ff88">SOFTWARE DEVELOPER</tspan></text><text x="630" y="235" font-size="10.5" fill="#6fcf9c" letter-spacing=".8">SPEC  <tspan fill="#00c46a">:: </tspan><tspan fill="#00ff88">FULL STACK // SECURITY</tspan></text><text x="630" y="254" font-size="10.5" fill="#6fcf9c" letter-spacing=".8">NODE  <tspan fill="#00c46a">:: </tspan><tspan fill="#00ff88">BRASIL // UTC-03</tspan></text>
  <text x="630" y="288" font-size="10.5" fill="#6fcf9c" letter-spacing=".8">ACCESS <tspan fill="#00c46a">:: </tspan><tspan fill="#d6ffea" font-weight="700" class="blink">GRANTED</tspan></text>
  <text x="986" y="332" text-anchor="end" font-size="9" letter-spacing="1" fill="#00c46a">BRUNO-SYS v2.0.77 // BUILD 2026</text>

  <!-- scanline -->
  <rect x="80" y="0" width="920" height="36" fill="#00ff88" opacity=".05" style="animation:sweep 5s linear infinite"/>
  <rect x="0" y="0" width="1000" height="340" fill="none" stroke="#0d4a2c"/>
  
</svg>